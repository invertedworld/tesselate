<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tessera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<aside class="rail">

  <section class="panel">
    <div class="label"><span>Tool</span><i></i></div>
    <div class="tools" id="tools">
      <button class="tool" data-tool="select" title="Select — Space (click a mark, drag to move)">
        <svg viewBox="0 0 24 24"><path d="M6 3.2v15.1l4.1-3.8 2.7 5.9 2.6-1.2-2.7-5.9 5.7-.6z"/></svg>
        <em>Select</em>
      </button>
      <button class="tool" data-tool="pencil" title="Pencil — P (freehand, held drag)">
        <svg viewBox="0 0 24 24"><path d="M4.2 19.8l3.9-1.1L20.6 6.4a2.1 2.1 0 0 0-3-3L5.3 15.9z"/><path d="M15.6 5.4l3 3"/></svg>
        <em>Pencil</em>
      </button>
      <button class="tool" data-tool="line" title="Line — L (click each end; Shift holds it square or to 45°)">
        <svg viewBox="0 0 24 24"><path d="M5.8 18.2L18.2 5.8"/><circle cx="4.6" cy="19.4" r="1.7"/><circle cx="19.4" cy="4.6" r="1.7"/></svg>
        <em>Line</em>
      </button>
      <button class="tool" data-tool="curve" title="Arc — A (click each end, then bend and click)">
        <svg viewBox="0 0 24 24"><path d="M4.6 19.4C4.6 10 10 4.6 19.4 4.6"/><circle cx="4.6" cy="19.4" r="1.7"/><circle cx="19.4" cy="4.6" r="1.7"/><path d="M4.6 4.6h.01" stroke-width="2.6"/></svg>
        <em>Arc</em>
      </button>
      <button class="tool" data-tool="circle" title="Circle — C (drag rim to rim, or click each end; hold Shift to draw from the centre)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 12h.01" stroke-width="2.4"/></svg>
        <em>Circle</em>
      </button>
      <button class="tool" data-tool="rect" title="Rectangle — R (click each corner; Shift squares it)">
        <svg viewBox="0 0 24 24"><rect x="4.6" y="6.6" width="14.8" height="10.8"/><path d="M4.6 6.6h.01" stroke-width="2.4"/></svg>
        <em>Rect</em>
      </button>
      <button class="tool" data-tool="fill" title="Fill — F (click an area, or a mark to recolour it)">
        <svg viewBox="0 0 24 24"><path d="M12 3.8L20.2 12 12 20.2 3.8 12z"/><path d="M12 20.2L3.8 12h16.4z" fill="currentColor" stroke="none"/></svg>
        <em>Fill</em>
      </button>
      <button class="tool" data-tool="erase" title="Erase — E (click or drag across a mark)">
        <svg viewBox="0 0 24 24"><path d="M9.2 19.6l-4.8-4.8 8.4-8.4 4.8 4.8z"/><path d="M9.2 19.6h10.4"/></svg>
        <em>Erase</em>
      </button>
    </div>
    <div class="grid2 binders">
      <button class="wide" id="groupBtn" title="Bind what you are holding into one thing — G or ⌘G" disabled>Group</button>
      <button class="wide" id="ungroupBtn" title="Let it loose again — U or ⇧⌘G" disabled>Ungroup</button>
    </div>
    <div class="grid2 binders">
      <button class="wide turn" id="turnLeftBtn" title="Turn what you are holding 45° anticlockwise" disabled>
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span>45°</span>
      </button>
      <button class="wide turn" id="turnRightBtn" title="Turn what you are holding 45° clockwise" disabled>
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>45°</span>
      </button>
    </div>
    <div class="grid3 binders">
      <button class="wide" id="cutBtn" title="Cut what you are holding — ⌘X" disabled>Cut</button>
      <button class="wide" id="copyBtn" title="Copy what you are holding — ⌘C" disabled>Copy</button>
      <button class="wide" id="pasteBtn" title="Paste — ⌘V" disabled>Paste</button>
    </div>
  </section>

  <section class="panel">
    <div class="label"><span>Table</span><i></i></div>
    <div class="grid2">
      <button class="iconbtn" id="undo" title="Undo — ⌘Z" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M4.7 9.3h9.4a5.2 5.2 0 1 1 0 10.4H7.6"/><path d="M9.1 4.6L4.2 9.3l4.9 4.7"/></svg>
      </button>
      <button class="iconbtn" id="redo" title="Redo — ⇧⌘Z" aria-label="Redo">
        <svg viewBox="0 0 24 24"><path d="M19.3 9.3H9.9a5.2 5.2 0 1 0 0 10.4h6.5"/><path d="M14.9 4.6l4.9 4.7-4.9 4.7"/></svg>
      </button>
    </div>
    <div class="grid2 files">
      <button class="wide" id="newDrawing" title="Start a new drawing">New</button>
      <button class="wide" id="loadJson" title="Open a drawing — ⌘O">Load</button>
      <button class="wide" id="saveJson" title="Save the drawing back to its file — ⌘S">Save</button>
      <button class="wide" id="saveJsonAs" title="Save the drawing to a new file — ⇧⌘S">Save as</button>
    </div>
    <p class="filename mono" id="fileName" hidden></p>
    <div class="confirm" id="newConfirm" hidden>
      <p>Do you want to save your changes?</p>
      <div class="grid3">
        <button class="wide fatal" id="newYes">Yes</button>
        <button class="wide" id="newNo">No</button>
        <button class="wide" id="newCancel">Cancel</button>
      </div>
    </div>
    <div class="grid2 exports">
      <button class="wide" id="exportSvg">Save SVG</button>
      <button class="wide" id="exportPng">Save PNG</button>
      <button class="wide span2" id="copyPng" title="Copy the tiling to the clipboard as a PNG">Copy PNG</button>
    </div>
  </section>

  <section class="panel">
    <div class="label"><span>Palette</span><i></i></div>

    <div class="pal-bar">
      <div class="sel"><select id="palSel" aria-label="Palette"></select></div>
      <button class="mini" id="palNew" title="Save these colours as a new named palette">New</button>
      <button class="mini" id="palDel" title="Delete this palette">Del</button>
    </div>

    <div class="pal-name" id="palNameRow" hidden>
      <input type="text" id="palName" class="mono" maxlength="22" placeholder="Name it" spellcheck="false" autocomplete="off">
      <button class="mini" id="palSave" title="Save the palette">Save</button>
      <button class="mini" id="palCancel" title="Cancel" aria-label="Cancel">&#215;</button>
    </div>

    <div class="swatches" id="swatches"></div>

    <div class="mixer">
      <span class="swatch-preview"><span class="well chk"><i id="mixInk"></i></span></span>
      <input type="text" id="hexInput" class="mono hex" spellcheck="false" autocomplete="off" maxlength="9" aria-label="Hex colour" placeholder="#rrggbbaa">
      <label class="pick" title="Choose a colour from the system picker">
        <input type="color" id="hexPick" aria-label="Colour picker">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 3.6a8.4 8.4 0 0 1 0 16.8z" fill="currentColor" stroke="none"/></svg>
      </label>
      <button class="mini drop" id="dropBtn" title="Eyedropper — click the drawing to take the colour under the pointer — I" aria-label="Eyedropper">
        <!-- Bootstrap Icons "eyedropper", MIT -->
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.354.646a1.207 1.207 0 0 0-1.708 0L8.5 3.793l-.646-.647a.5.5 0 1 0-.708.708L8.293 5l-7.147 7.146A.5.5 0 0 0 1 12.5v1.793l-.854.853a.5.5 0 1 0 .708.707L1.707 15H3.5a.5.5 0 0 0 .354-.146L11 7.707l1.146 1.147a.5.5 0 0 0 .708-.708l-.647-.646 3.147-3.146a1.207 1.207 0 0 0 0-1.708zM2 12.707l7-7L10.293 7l-7 7H2z"/></svg>
      </button>
      <button class="mini add" id="addSwatch" title="Add this colour to the palette" aria-label="Add colour">+</button>
    </div>

    <div class="row slide">
      <span class="mono tiny">Alpha</span>
      <input type="range" id="alpha" min="0" max="100" step="1" value="100" aria-label="Opacity">
      <span class="mono num" id="alphaVal">100</span>
    </div>
    <div class="row slide">
      <span class="mono tiny">Width</span>
      <input type="range" id="width" min="1" max="64" step="1" value="9" aria-label="Stroke weight">
      <span class="mono num" id="widthVal">9</span>
    </div>

    <button class="wide toggle" data-toggle="filled" id="filledBtn">
      <span class="tick"></span><span>Filled shapes</span>
    </button>
  </section>

  <section class="panel">
    <div class="label"><span>Plane</span><i></i></div>
    <div class="grid2 toggles2">
      <button class="wide toggle" data-toggle="grid" title="The tile grid across the plane — T"><span class="tick"></span><span>Tile rules</span></button>
      <button class="wide toggle" data-toggle="clip"><span class="tick"></span><span>Clip tile</span></button>
      <button class="wide toggle" data-toggle="wrap"><span class="tick"></span><span>Wrap edges</span></button>
      <button class="wide toggle" data-toggle="snap" title="Snap to the alignment grid — S (hold Alt to ignore)"><span class="tick"></span><span>Snap to grid</span></button>
    </div>
    <div class="sub-row">
      <span class="mono tiny">Grid</span>
      <div class="subs" id="subs"></div>
    </div>
    <div class="sub-row">
      <span class="mono tiny">Frame</span>
      <div class="modes" id="diagModes"></div>
    </div>
  </section>

  <details class="panel fold" id="symmetryPanel">
    <summary class="label"><span>Symmetry</span><i></i><b class="fold-mark" aria-hidden="true"></b></summary>
    <div class="fold-body">
      <div class="chips" id="presets"></div>
      <div class="row block-row">
        <span class="mono tiny">Block</span>
        <div class="sizes" id="sizes"></div>
      </div>
      <div class="pattern-grid" id="patternGrid"></div>
      <p class="note">Click a tile to turn it a quarter. The upright arrow is your drawing surface.</p>
    </div>
  </details>

</aside>

<main class="stage-wrap">
  <canvas id="stage"></canvas>
</main>

<script src="src/geometry.js"></script>
<script src="src/patterns.js"></script>
<script src="src/app.js"></script>
</body>
</html>
